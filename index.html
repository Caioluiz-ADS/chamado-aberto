<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamado Aberto | Jovem Protagonista IEL</title>
  <meta name="description" content="Sistema de chamados de manutenção de elevadores e ar-condicionado. Protótipo ilustrativo do projeto Jovem Protagonista (IEL Bahia).">
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica o tema e a escolha de animações antes de desenhar a página, para não piscar.
    try {
      var tema = localStorage.getItem("chamado-aberto:tema");
      if (tema === "claro" || tema === "escuro") document.documentElement.setAttribute("data-tema", tema);
      if (localStorage.getItem("chamado-aberto:animacoes") === "desligadas") document.documentElement.setAttribute("data-animacoes", "desligadas");
    } catch (_) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/secoes.css">
  <link rel="stylesheet" href="css/animacoes.css">
</head>
<body>
  <div id="app"></div>

  <!-- Janelas: painel lateral do chamado, confirmação e pesquisa de satisfação -->
